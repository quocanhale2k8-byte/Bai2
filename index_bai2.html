<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jackson Electronics</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="page">

        <!-- Logo -->
        <table class="logo" cellspacing="0" cellpadding="0">
            <tr>
                <td>Jackson</td>
            </tr>
            <tr>
                <td>Electronics</td>
            </tr>
        </table>

        <h1>Registration Form</h1>
        <p class="intro">Register your Jackson Electronics product here</p>

        <form action="#" method="get">
            <!-- Main form layout -->
            <table class="form-table" cellspacing="0" cellpadding="0">

                <!-- First Name / Last Name -->
                <tr>
                    <td class="label-col">
                        <label for="first-name">First Name:</label>
                    </td>
                    <td>
                        <table class="inline-table name-row" cellspacing="0" cellpadding="0">
                            <tr>
                                <td>
                                    <input
                                        type="text"
                                        id="first-name"
                                        name="firstName"
                                        class="first-name"
                                    >
                                </td>
                                <td class="small-label">
                                    <label for="last-name">Last Name:</label>
                                </td>
                                <td>
                                    <input
                                        type="text"
                                        id="last-name"
                                        name="lastName"
                                        class="last-name"
                                    >
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <!-- Address #1 -->
                <tr>
                    <td class="label-col">
                        <label for="address1">Address #1:</label>
                    </td>
                    <td>
                        <input
                            type="text"
                            id="address1"
                            name="address1"
                            class="address-input"
                        >
                    </td>
                </tr>

                <!-- Address #2 -->
                <tr>
                    <td class="label-col">
                        <label for="address2">Address #2:</label>
                    </td>
                    <td>
                        <input
                            type="text"
                            id="address2"
                            name="address2"
                            class="address-input"
                        >
                    </td>
                </tr>

                <!-- City / State / Zip -->
                <tr>
                    <td class="label-col">
                        <label for="city">City:</label>
                    </td>
                    <td>
                        <table class="inline-table city-row" cellspacing="0" cellpadding="0">
                            <tr>
                                <td>
                                    <input
                                        type="text"
                                        id="city"
                                        name="city"
                                        class="city-input"
                                    >
                                </td>
                                <td class="small-label state-label">
                                    <label for="state">State:</label>
                                </td>
                                <td>
                                    <input
                                        type="text"
                                        id="state"
                                        name="state"
                                        class="state-input"
                                        maxlength="2"
                                    >
                                </td>
                                <td class="small-label zip-label">
                                    <label for="zip">Zip:</label>
                                </td>
                                <td>
                                    <input
                                        type="text"
                                        id="zip"
                                        name="zip"
                                        class="zip-input"
                                    >
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <!-- Country -->
                <tr>
                    <td class="label-col">
                        <label for="country">Country:</label>
                    </td>
                    <td>
                        <input
                            type="text"
                            id="country"
                            name="country"
                            class="country-input"
                            value="United States"
                        >
                    </td>
                </tr>

                <!-- Separator -->
                <tr>
                    <td colspan="2">
                        <hr>
                    </td>
                </tr>

                <!-- Product -->
                <tr>
                    <td class="label-col">
                        <label for="product">Product:</label>
                    </td>
                    <td>
                        <select id="product" name="product" class="product-select">
                            <option>ScanMaster</option>
                            <option>LaserPrint 1000</option>
                            <option>Print/Scan 150</option>
                        </select>
                    </td>
                </tr>

                <!-- Date Purchased -->
                <tr>
                    <td class="label-col">
                        <label for="date-purchased">Date Purchased:</label>
                    </td>
                    <td>
                        <input
                            type="text"
                            id="date-purchased"
                            name="datePurchased"
                            class="medium-input"
                        >
                    </td>
                </tr>

                <!-- Serial # -->
                <tr>
                    <td class="label-col">
                        <label for="serial">Serial #:</label>
                    </td>
                    <td>
                        <input
                            type="text"
                            id="serial"
                            name="serial"
                            class="medium-input"
                        >
                    </td>
                </tr>

                <!-- Used for -->
                <tr class="used-row">
                    <td class="label-col top-label">Used for:</td>
                    <td>
                        <table class="choice-table" cellspacing="0" cellpadding="0">
                            <tr>
                                <td>
                                    <label>
                                        <input type="radio" name="usedFor" value="home">
                                        Home
                                    </label>
                                </td>
                                <td>
                                    <label>
                                        <input type="radio" name="usedFor" value="education">
                                        Educational Institution
                                    </label>
                                </td>
                            </tr>
                            <tr>
                                <td>
                                    <label>
                                        <input type="radio" name="usedFor" value="business" checked>
                                        Business
                                    </label>
                                </td>
                                <td>
                                    <label>
                                        <input type="radio" name="usedFor" value="other">
                                        Other
                                    </label>
                                </td>
                            </tr>
                            <tr>
                                <td>
                                    <label>
                                        <input type="radio" name="usedFor" value="government">
                                        Government
                                    </label>
                                </td>
                                <td>&nbsp;</td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <!-- System -->
                <tr class="system-row">
                    <td class="label-col top-label">
                        System (check all that apply):
                    </td>
                    <td>
                        <table class="choice-table system-table" cellspacing="0" cellpadding="0">
                            <tr>
                                <td>
                                    <label>
                                        <input type="checkbox" name="system" value="windows">
                                        Windows
                                    </label>
                                </td>
                                <td>
                                    <label>
                                        <input type="checkbox" name="system" value="unix">
                                        UNIX
                                    </label>
                                </td>
                            </tr>
                            <tr>
                                <td>
                                    <label>
                                        <input type="checkbox" name="system" value="macintosh">
                                        Macintosh
                                    </label>
                                </td>
                                <td>
                                    <label>
                                        <input type="checkbox" name="system" value="other">
                                        Other
                                    </label>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <!-- Separator -->
                <tr>
                    <td colspan="2">
                        <hr class="bottom-line">
                    </td>
                </tr>

                <!-- Comments -->
                <tr class="comments-row">
                    <td class="label-col top-label">
                        <label for="comments">Comments?:</label>
                    </td>
                    <td>
                        <textarea
                            id="comments"
                            name="comments"
                            class="comments"
                        ></textarea>
                    </td>
                </tr>

                <!-- Buttons -->
                <tr>
                    <td colspan="2" class="button-cell">
                        <button type="submit">Click to register</button>
                        <button type="reset">Click to cancel</button>
                    </td>
                </tr>

            </table>
        </form>
    </div>
</body>
</html>
